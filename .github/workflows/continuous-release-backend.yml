name: Continuous Release - Backend

on:
  workflow_call:
    inputs:
      component:
        description: 'Which component to release (e.g. backend)'
        required: true
        type: string
      release_type:
        description: 'Semantic version bump: major, minor, or patch'
        required: true
        type: string
jobs:
  release:
    name: Create release (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure mvnw executable if present
        run: |
          if [ -f ./mvnw ]; then chmod +x ./mvnw || true; fi

      - name: Read current Maven project version
        id: current_ver
        run: |
          set -e
          # Try using the wrapper if present, otherwise mvn
          if [ -f ./mvnw ]; then
            ver=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || true)
          else
            ver=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || true)
          fi
          if [ -z "$ver" ]; then
            echo "Failed to determine project.version" >&2
            exit 1
          fi
          echo "current_version=$ver" >> $GITHUB_OUTPUT

      - name: Calculate next release version
        id: bump
        run: |
          set -e
          current="${{ steps.current_ver.outputs.current_version }}"
          # strip -SNAPSHOT suffix if present
          base=${current%-SNAPSHOT}
          IFS='.' read -r major minor patch <<< "$base"
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "Failed to parse current version: $current" >&2
            exit 1
          fi
          case "${{ inputs.release_type }}" in
            major)
              major=$((major+1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor+1))
              patch=0
              ;;
            patch)
              patch=$((patch+1))
              ;;
            *)
              echo "Invalid release_type '${{ inputs.release_type }}' - expected major/minor/patch" >&2
              exit 1
              ;;
          esac
          new="$major.$minor.$patch"
          echo "new_version=$new" >> $GITHUB_OUTPUT
          echo "tag_name=v$new" >> $GITHUB_OUTPUT

      - name: Check tag does not already exist
        env:
          TAG: ${{ steps.bump.outputs.tag_name }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Version file may be out of sync with existing tags."
            exit 1
          fi

      - name: Create git tag
        env:
          TAG: ${{ steps.bump.outputs.tag_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Bump version in pom.xml
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -e
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw org.codehaus.mojo:versions-maven-plugin:set -DnewVersion="${NEW_VERSION}-SNAPSHOT" -DgenerateBackupPoms=false -q
          else
            mvn org.codehaus.mojo:versions-maven-plugin:set -DnewVersion="${NEW_VERSION}-SNAPSHOT" -DgenerateBackupPoms=false -q
          fi

      - name: Commit version bump
        run: |
          set -e
          git add pom.xml
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}-SNAPSHOT [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag_name }}
          name: ${{ steps.bump.outputs.tag_name }}
          body: |
            Automatic release generated by reusable pipeline.
            Component: ${{ inputs.component }}
            Bump: ${{ inputs.release_type }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
