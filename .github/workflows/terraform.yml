name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  TF_WORKING_DIR: terraform
  TF_VAR_postgres_db: ${{ secrets.POSTGRES_DB }}
  TF_VAR_postgres_user: ${{ secrets.POSTGRES_USER }}
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
  TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
  TF_VAR_jwt_expiration: ${{ secrets.JWT_EXPIRATION }}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Ensure RDS is available before plan
        run: |
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier isteamx-postgres \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          echo "Current RDS status: $DB_STATUS"
          if [ "$DB_STATUS" == "stopped" ] || [ "$DB_STATUS" == "stopping" ]; then
            if [ "$DB_STATUS" == "stopping" ]; then
              echo "Waiting for RDS to fully stop..."
              aws rds wait db-instance-stopped --db-instance-identifier isteamx-postgres
            fi
            echo "Starting RDS..."
            aws rds start-db-instance --db-instance-identifier isteamx-postgres
            echo "Waiting for RDS to become available..."
            aws rds wait db-instance-available --db-instance-identifier isteamx-postgres
          elif [ "$DB_STATUS" != "available" ]; then
            echo "Waiting for RDS to become available..."
            aws rds wait db-instance-available --db-instance-identifier isteamx-postgres || true
          fi
          echo "RDS is ready."

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init

      - name: Ensure RDS is available before apply
        run: |
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier isteamx-postgres \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          echo "Current RDS status: $DB_STATUS"
          
          if [ "$DB_STATUS" == "stopped" ] || [ "$DB_STATUS" == "stopping" ]; then
            if [ "$DB_STATUS" == "stopping" ]; then
              echo "RDS is stopping. Waiting for it to fully stop first..."
              aws rds wait db-instance-stopped --db-instance-identifier isteamx-postgres
            fi
            echo "RDS is stopped. Starting it before apply..."
            aws rds start-db-instance --db-instance-identifier isteamx-postgres
            echo "Waiting for RDS to become available (this may take a few minutes)..."
            aws rds wait db-instance-available --db-instance-identifier isteamx-postgres
            echo "RDS is now available."
          elif [ "$DB_STATUS" == "starting" ] || [ "$DB_STATUS" == "configuring-enhanced-monitoring" ] || [ "$DB_STATUS" == "backing-up" ]; then
            echo "RDS is in transitional state ($DB_STATUS). Waiting for it to become available..."
            aws rds wait db-instance-available --db-instance-identifier isteamx-postgres
            echo "RDS is now available."
          elif [ "$DB_STATUS" == "available" ]; then
            echo "RDS is already available. Proceeding."
          else
            echo "RDS status: $DB_STATUS — attempting to wait for available state..."
            aws rds wait db-instance-available --db-instance-identifier isteamx-postgres || true
          fi

      - name: Terraform Apply
        run: terraform apply tfplan

