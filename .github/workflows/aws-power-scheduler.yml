name: AWS Power Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to START or STOP the AWS infrastructure"
        required: true
        type: choice
        options:
          - start
          - stop

env:
  AWS_REGION: eu-central-1

jobs:
  manage_aws_resources:
    name: Manage AWS Compute Resources
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute ${{ github.event.inputs.action }} command
        run: |
          ACTION="${{ github.event.inputs.action }}"
          ASG_NAME="isteamx-backend-asg"
          
          if [ "$ACTION" == "start" ]; then
            echo "Starting RDS instance first (needs time to become available)..."
            aws rds start-db-instance --db-instance-identifier isteamx-postgres || echo "RDS instance might already be starting or running."

            echo "Scaling up ASG to 1 instance..."
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$ASG_NAME" \
              --min-size 0 \
              --max-size 1 \
              --desired-capacity 1

            echo "Waiting for instance to launch and become healthy..."
            aws autoscaling wait group-in-service --auto-scaling-group-name "$ASG_NAME" || true
            echo "ASG instance is running."
            
          elif [ "$ACTION" == "stop" ]; then
            echo "Scaling down ASG to 0 instances..."
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$ASG_NAME" \
              --min-size 0 \
              --max-size 1 \
              --desired-capacity 0

            echo "Waiting for instances to terminate..."
            sleep 30
            EC2_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:aws:autoscaling:groupName,Values=$ASG_NAME" "Name=instance-state-name,Values=running,shutting-down,stopping" \
              --query "Reservations[*].Instances[*].InstanceId" --output text)
            if [ -n "$EC2_IDS" ]; then
              echo "Waiting for EC2 instances to terminate: $EC2_IDS"
              aws ec2 wait instance-terminated --instance-ids $EC2_IDS || true
            fi
            echo "ASG scaled to 0. All EC2 instances terminated."

            echo "Stopping RDS instance..."
            aws rds stop-db-instance --db-instance-identifier isteamx-postgres || echo "RDS instance might already be stopping or stopped."
            
          else
            echo "Invalid action: $ACTION"
            exit 1
          fi
