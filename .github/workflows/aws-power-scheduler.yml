name: AWS Power Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to START or STOP the AWS infrastructure"
        required: true
        type: choice
        options:
          - start
          - stop

env:
  AWS_REGION: eu-central-1

jobs:
  manage_aws_resources:
    name: Manage AWS Compute Resources
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute ${{ github.event.inputs.action }} command
        run: |
          ACTION="${{ github.event.inputs.action }}"
          
          if [ "$ACTION" == "start" ]; then
            echo "Starting RDS instance first (needs time to become available)..."
            aws rds start-db-instance --db-instance-identifier isteamx-postgres || echo "RDS instance might already be starting or running."

            echo "Starting EC2 instances..."
            EC2_IDS=$(aws ec2 describe-instances --filters "Name=tag:Project,Values=isteamx" "Name=instance-state-name,Values=stopped" --query "Reservations[*].Instances[*].InstanceId" --output text)
            if [ -n "$EC2_IDS" ]; then
              aws ec2 start-instances --instance-ids $EC2_IDS
              echo "EC2 instances started: $EC2_IDS"
              echo "Waiting for EC2 instances to be running..."
              aws ec2 wait instance-running --instance-ids $EC2_IDS
              echo "EC2 instances are running."
            else
              echo "No stopped EC2 instances found."
            fi
            
          elif [ "$ACTION" == "stop" ]; then
            echo "Stopping EC2 instances..."
            EC2_IDS=$(aws ec2 describe-instances --filters "Name=tag:Project,Values=isteamx" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].InstanceId" --output text)
            if [ -n "$EC2_IDS" ]; then
              aws ec2 stop-instances --instance-ids $EC2_IDS
              echo "EC2 instances stopped: $EC2_IDS"
            else
              echo "No running EC2 instances found."
            fi

            echo "Stopping RDS instance..."
            aws rds stop-db-instance --db-instance-identifier isteamx-postgres || echo "RDS instance might already be stopping or stopped."
            
          else
            echo "Invalid action: $ACTION"
            exit 1
          fi
