services:
  backend:
    build:
      context: ../../IS-Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../../IS-Backend/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-app_db}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-true}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/isteamx/backend}
      - CLOUDWATCH_LOG_STREAM=${CLOUDWATCH_LOG_STREAM:-app}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - isteamx-network

  frontend:
    build:
      context: ../../IS-Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - isteamx-network

  database:
    image: postgres:15-alpine
    env_file:
      - ../../IS-Backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - isteamx-network

networks:
  isteamx-network:
    driver: bridge

volumes:
  postgres-data:
